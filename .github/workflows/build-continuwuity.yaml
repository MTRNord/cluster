name: Build Continuwuity Wrapper Image

on:
  push:
    branches: ["main"]
    paths:
      - "apps/talos_cluster/continuwuity/Dockerfile"
      - ".github/workflows/build-continuwuity.yaml"
  schedule:
    # Rebuild daily at 03:00 UTC to pick up upstream :main changes
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    #if: false  # disabled — replaced by in-cluster image-builder cronjob
    name: Build and Push
    runs-on: ubuntu-latest
    environment: registry
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to self-hosted registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.midnightthoughts.space
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: registry.midnightthoughts.space/mtrnord/cluster/continuwuity
          labels: |
            org.opencontainers.image.description=Continuwuity (Conduit fork) Matrix homeserver — multi-arch wrapper image
            org.opencontainers.image.title=continuwuity
            org.opencontainers.image.vendor=MTRNord
          tags: |
            type=raw,value=main
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,prefix=sha-

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/talos_cluster/continuwuity
          file: apps/talos_cluster/continuwuity/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_OCI_EXPERIMENTAL: "1"
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            --registry-referrers-mode=oci-1-1 \
            "registry.midnightthoughts.space/mtrnord/cluster/continuwuity@${DIGEST}"
