name: Validate GitOps Manifests

on:
  pull_request:
    branches: ["*"]
    paths:
      - "apps/**"
      - "clusters/**"
      - "infrastructure_talos/**"
      - "scripts/validate.sh"
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "clusters/**"
      - "infrastructure_talos/**"
      - "scripts/validate.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8 # main

      - name: Setup tools
        run: |
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          # Install kubeconform
          curl -LO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

          # Verify installations
          yq --version
          kustomize version
          kubeconform -v

      - name: Run validation script
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools for manifest extraction
        run: |
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Extract container images
        id: extract-images
        run: |
          set +e
          mkdir -p /tmp/manifests

          # Build all kustomizations and extract images
          find . -type f -name 'kustomization.yaml' | while read -r file; do
            dir=$(dirname "$file")
            echo "Building $dir"
            kustomize build "$dir" --load-restrictor=LoadRestrictionsNone > /tmp/manifests/$(echo "$dir" | tr '/' '_').yaml 2>/dev/null || true
          done

          # Extract unique images
          cat /tmp/manifests/*.yaml | yq eval 'select(.spec.template.spec.containers != null) | .spec.template.spec.containers[].image' - 2>/dev/null | sort -u > /tmp/images.txt || true
          cat /tmp/manifests/*.yaml | yq eval 'select(.spec.template.spec.initContainers != null) | .spec.template.spec.initContainers[].image' - 2>/dev/null | sort -u >> /tmp/images.txt || true

          # Extract images from HelmRelease values
          find . -type f -name '*.yaml' -exec grep -l "kind: HelmRelease" {} \; | while read -r file; do
            yq eval '.spec.values | .. | select(. == "*image*" or . == "*repository*") | select(type == "!!str")' "$file" 2>/dev/null || true
          done >> /tmp/images.txt || true

          sort -u /tmp/images.txt > /tmp/images_final.txt

          echo "Found images:"
          cat /tmp/images_final.txt

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  kubescape:
    name: Kubescape Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup tools
        run: |
          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Build manifests
        run: |
          mkdir -p manifests
          find . -type f -name 'kustomization.yaml' | while read -r file; do
            dir=$(dirname "$file")
            echo "Building $dir"
            kustomize build "$dir" --load-restrictor=LoadRestrictionsNone > manifests/$(echo "$dir" | tr '/' '_').yaml 2>/dev/null || true
          done
          ls -la manifests/

      - name: Run Kubescape
        uses: kubescape/github-action@d65853c2832df0d379201ceaea331b5820ab9070 # main
        continue-on-error: true
        with:
          files: "manifests/"
          severityThreshold: high
          format: sarif
          verbose: true
          outputFile: results.sarif

      - name: Fix Kubescape SARIF artifact locations
        if: always()
        run: |
          if [ -f results.sarif ]; then
            jq '
              .runs[].results[] |= (
                if .locations then
                  .locations[] |= (
                    if .physicalLocation then
                      .physicalLocation.artifactLocation.uri //= "unknown"
                    else
                      .physicalLocation = {"artifactLocation": {"uri": "unknown"}}
                    end
                  )
                else
                  .locations = [{"physicalLocation": {"artifactLocation": {"uri": "unknown"}}}]
                end
              )
            ' results.sarif > results-fixed.sarif && mv results-fixed.sarif results.sarif
          fi

      - name: Upload Kubescape results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: "results.sarif"

  lint:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        continue-on-error: true
        with:
          config_file: .yamllint
